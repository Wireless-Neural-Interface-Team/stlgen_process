[project]
name = "process-stl"
version = "0.1.0"
description = "Measure STL geometries (bbox / center of mass statistics) and derive the dLGN/VS insertion protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "pandas>=1.4",
    "matplotlib>=3.5",
    "seaborn>=0.13",
    "pyvista>=0.44",  # per-entry legend faces
    # GUI (process-stl-gui)
    "PySide6>=6.5",
    "pyvistaqt>=0.11",
]

[project.optional-dependencies]
gui = []  # kept so `pip install -e ".[gui]"` still works; GUI deps are now core
notebook = ["pyvista[jupyter]>=0.43", "ipykernel"]

[project.scripts]
process-stl = "process_stl.cli:main"
process-stl-gui = "process_stl.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["process_stl"]
